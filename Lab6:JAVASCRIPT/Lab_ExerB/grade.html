<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Grade Calculator</title>
    <!-- NEW: link the external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Student Grade Calculator</h2>

    <!-- FIX: "return" stops the form from submitting and reloading the page -->
    <form name="gradeForm" onsubmit="return checkMark()">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br>
        <label for="mark">Mark (0-100):</label>
        <input type="text" id="mark" name="mark">
        <!-- NEW: Random Mark button -->
        <button type="button" onclick="randomMark()">Random Mark</button><br>
        <button type="submit">Check Grade</button>
    </form>

    <p id="result"></p>
    <!-- NEW: date and time the grade was checked -->
    <p id="checkedOn"></p>

    <!-- FIX: function name is showTable (capital T) -->
    <button onclick="showTable()">Show Grade Table</button>
    <div id="tableContainer"></div>

    <!-- FIX: file name is grade.js, not grades.js -->
    <script src="grade.js"></script>
</body>
</html>
