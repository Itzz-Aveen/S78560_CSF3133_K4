<!DOCTYPE html>
<html>
<head>
  <title>My Profile</title>
</head>
<body>

<header>
  <h1>My Profile</h1>
</header>

<nav>
  <a href="#about">About</a>
  <a href="#info">Info</a>
  <a href="#form">Form</a>
</nav>

<section id="about">
  <article>
    <h2>About Me</h2>
    <p>Hello, I am a student learning HTML.</p>
  </article>
</section>

<section id="info">
  <h2>My Information</h2>
  <table border="1">
    <tr>
      <th>Name</th>
      <th>Age</th>
      <th>Occupation</th>
    </tr>
    <tr>
      <td>Aiman</td>
      <td>19</td>
      <td>Student</td>
    </tr>
    <tr>
      <td>Sara</td>
      <td>20</td>
      <td>Teacher</td>
    </tr>
  </table>
</section>

<section id="form">
  <h2>Fill the Form</h2>
  <form>
    <p>Name: <input type="text" name="name"></p>

    <p>Email: <input type="email" name="email"></p>

    <p>Gender:
      <input type="radio" name="gender" value="male"> Male
      <input type="radio" name="gender" value="female"> Female
    </p>

    <p>Hobbies:
      <input type="checkbox" name="hobby" value="reading"> Reading
      <input type="checkbox" name="hobby" value="sports"> Sports
      <input type="checkbox" name="hobby" value="music"> Music
    </p>

    <input type="submit" value="Submit">
  </form>
</section>

<footer>
  <p>My Profile Page 2026</p>
</footer>

</body>
</html>
